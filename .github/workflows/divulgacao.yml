name: Narração dos vídeos de divulgação

on:
  workflow_dispatch:
    inputs:
      falas:
        description: "Ids das falas (separados por vírgula). Vazio = todas"
        default: ""
        required: false

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar no ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node divulgacao/gerar.mjs "${{ inputs.falas }}"
      - name: Publicar
        run: |
          git config user.name "Gerador de áudios"
          git config user.email "actions@users.noreply.github.com"
          git add divulgacao/audio
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Narração dos vídeos de divulgação"
          git pull --rebase origin main
          git push origin HEAD:main
