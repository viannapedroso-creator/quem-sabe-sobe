name: Gerar áudios da Coruja

on:
  workflow_dispatch:
    inputs:
      grupos:
        description: "Grupos: todos, fixas, personagens, numeros, categorias, reacoes, perguntas (separe por vírgula)"
        default: "fixas"
        required: true
      limite:
        description: "Máximo de caracteres nesta execução (créditos do ElevenLabs)"
        default: "5000"
        required: true
      refazer:
        description: "Códigos para gravar de novo, separados por vírgula (opcional). Ex.: grito,manda_vaca"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: audios
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar no ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node narracao/gerar.mjs --grupos "${{ inputs.grupos }}" --limite "${{ inputs.limite }}" --refazer "${{ inputs.refazer }}"
      - name: Publicar os áudios
        if: always()
        run: |
          git config user.name "Gerador de áudios"
          git config user.email "actions@users.noreply.github.com"
          git add audio narracao/estado.json narracao/falas.csv
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Áudios da Coruja: ${{ inputs.grupos }}"
          git pull --rebase origin main
          git push origin HEAD:main
