name: Gerar efeitos sonoros e músicas

on:
  workflow_dispatch:
    inputs:
      refazer:
        description: "Sons para gerar de novo, separados por vírgula (opcional). Ex.: sfx_porta,musica_sala"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: audios
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Gerar no ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node narracao/sons.mjs --refazer "${{ inputs.refazer }}"
      - name: Publicar
        if: always()
        run: |
          git config user.name "Gerador de áudios"
          git config user.email "actions@users.noreply.github.com"
          git add audio narracao/sons-estado.json
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Efeitos sonoros e músicas"
          git pull --rebase origin main
          git push origin HEAD:main
